# cargo-deny configuration -- supply-chain, advisory, and license gate.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Audit the union of both graphs: Windows is the shipped target, and Linux is
# where the host jobs and the cross-build's build scripts and proc-macros
# compile, so code from both graphs executes.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
# An ignore that no longer matches fails, so it cannot mask the same advisory
# when an affected version comes back.
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained; pulled in by urlpattern via tauri-utils on both graphs; no first-party fix" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained; pulled in by urlpattern via tauri-utils on both graphs; no first-party fix" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained; pulled in by urlpattern via tauri-utils on both graphs; no first-party fix" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained; pulled in by urlpattern via tauri-utils on both graphs; no first-party fix" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained; pulled in by urlpattern via tauri-utils on both graphs; no first-party fix" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; pulled in by glib-macros 0.18 on the Linux graph only; no first-party fix" },
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 is unsound; pulled in by the gtk 0.18 stack on the Linux graph only; no first-party fix" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# A listed license that no crate uses fails, so the list cannot keep one that
# nobody re-reviewed.
unused-allowed-license = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
exceptions = []

[bans]
# The tauri and windows trees ship several versions of the same crate and
# nothing first-party can collapse them (clippy's twin is allowed in
# Cargo.toml for the same reason).
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# TLS is rustls with the platform verifier; a feature change that pulls in
# OpenSSL or native-tls fails here.
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
