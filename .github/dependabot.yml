version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/crates/launcher"
    schedule:
      interval: "weekly"
    ignore:
      # svelte-check still caps its peer at typescript ^5 || ^6 (checked 4.7.6),
      # so a major TypeScript bump breaks `npm ci`. Drop this once it allows ^7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
